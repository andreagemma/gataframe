[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gataframe"
dynamic = ["version"]
description = "DuckDB-backed dataframe helpers for tabular and geospatial data workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Andrea Gemma" }
]
keywords = ["gataframe", "duckdb", "dataframe", "pandas", "geopandas", "etl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database :: Front-Ends",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "duckdb>=1.1",
  "geopandas>=0.14",
  "pandas>=2.0",
  "pydantic>=2.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0"
]
dev = [
  "build>=1.2",
  "joblib>=1.4",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "twine>=5.1"
]
parallel = [
  "joblib>=1.4"
]

[project.urls]
Documentation = "https://github.com/andreagemma/gataframe#readme"
Issues = "https://github.com/andreagemma/gataframe/issues"
Source = "https://github.com/andreagemma/gataframe"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gataframe = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "gataframe._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["gataframe"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  ".venv",
  "build",
  "dist",
  "src/gataframe.egg-info",
  "venv",
  "wheel-smoke-test"
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
files = ["src/gataframe"]
warn_unused_configs = true
check_untyped_defs = true
follow_imports = "skip"
no_site_packages = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
  "gataframe.engine",
  "gataframe.files",
  "gataframe.gata_frame"
]
ignore_errors = true
