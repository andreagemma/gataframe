name: Quality
run-name: Quality - ${{ inputs.commit_name || github.ref_name }}

on:
  workflow_call:
    inputs:
      commit_name:
        description: Commit name shown in run title
        required: false
        type: string
  workflow_dispatch:
    inputs:
      commit_name:
        description: "Commit name shown in run title"
        required: false
        type: string

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
