name: Create Release (whl)
run-name: Create Release whl - ${{ inputs.commit_name || github.ref_name }}

on:
  workflow_call:
    inputs:
      commit_name:
        description: Commit name shown in run title
        required: false
        type: string
      version:
        description: Release/tag (optional). If empty use the package version
        required: false
        type: string
        default: ""
      overwrite_existing:
        description: Overwrite existing release/tag
        required: true
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      commit_name:
        description: Commit name shown in run title
        required: false
        type: string
      version:
        description: "Release/tag (optional). If empty use the package version"
        required: false
        default: ""
      overwrite_existing:
        description: "Overwrite existing release/tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve version and tag
        id: vars
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          input_version = os.environ.get("INPUT_VERSION", "").strip()
          if input_version:
              tag = input_version
              source = "workflow input"
          else:
              version_file = Path("src/gataframe/_version.py")
              if not version_file.exists():
                  raise SystemExit(f"Version file not found: {version_file}")

              spec = importlib.util.spec_from_file_location("gataframe._version", version_file)
              if spec is None or spec.loader is None:
                  raise SystemExit("Unable to load version module")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              tag = getattr(module, "__version__", "").strip()
              if not tag:
                  raise SystemExit("package __version__ is empty")
              source = "package __version__"

          gh_out = os.environ["GITHUB_OUTPUT"]
          with open(gh_out, "a", encoding="utf-8") as f:
              f.write(f"tag={tag}\n")
              f.write(f"version_source={source}\n")

          print(f"Resolved tag: {tag} (source: {source})")
          PY
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Check existing release/tag
        id: check_release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `${{ steps.vars.outputs.tag }}`;
            const overwrite = `${{ inputs.overwrite_existing }}` === 'true';

            let exists = false;
            let releaseId = null;

            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              exists = true;
              releaseId = rel.data.id;
              core.info(`Release for tag ${tag} already exists (id=${releaseId}).`);
            } catch (err) {
              if (err.status !== 404) {
                throw err;
              }
            }

            core.setOutput('exists', exists ? 'true' : 'false');

            if (!exists) {
              core.info(`No release found for tag ${tag}.`);
              return;
            }

            if (!overwrite) {
              core.setFailed(
                `Release/tag '${tag}' already exists. Rerun workflow with overwrite_existing=true to replace it.`
              );
              return;
            }

            core.warning(`overwrite_existing=true: deleting existing release/tag '${tag}'.`);

            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: releaseId,
            });

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
            } catch (err) {
              if (err.status !== 404 && err.status !== 422) {
                throw err;
              }
            }

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Create GitHub release and upload wheel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ga-gataframe ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          files: dist/*.whl
          fail_on_unmatched_files: true

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo "- Tag: ${{ steps.vars.outputs.tag }}"
            echo "- Version source: ${{ steps.vars.outputs.version_source }}"
            echo "- Existing release found: ${{ steps.check_release.outputs.exists || 'false' }}"
            echo "- overwrite_existing: ${{ inputs.overwrite_existing }}"
          } >> "$GITHUB_STEP_SUMMARY"
